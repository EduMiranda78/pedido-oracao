name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pedido_oracao_ci
          POSTGRES_USER: pedido_oracao_ci
          POSTGRES_PASSWORD: pedido_oracao_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedido_oracao_ci -d pedido_oracao_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      POSTGRES_DB: pedido_oracao_ci
      POSTGRES_USER: pedido_oracao_ci
      POSTGRES_PASSWORD: pedido_oracao_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q config prayers

      - name: Django system check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test prayers -v 2

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q
